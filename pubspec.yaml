name: colormix_studio
description: "Hair color formula and Bluetooth scale prototype"
publish_to: 'none'

# keep in step with AppInfo.version (lib/core/constants/app_info.dart)
version: 0.1.0+1

environment:
  sdk: ^3.13.7

# what each one is for: README.md, Dependencies
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  intl: ^0.20.3
  universal_ble: ^3.1.2
  flex_color_picker: ^4.0.0
  wakelock_plus: ^1.8.2
  uuid: ^4.6.0
  clock: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
