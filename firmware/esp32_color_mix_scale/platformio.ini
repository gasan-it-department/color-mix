; ColorMix scale firmware. `pio run -e esp32dev -t upload` to flash,
; `pio test -e native` runs the protocol / filter / calibration tests on the PC

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.2
    robtillaart/HX711@^0.6.5
build_flags =
    -DFW_VERSION=\"0.1.0\"
; the unity tests run on the pc, not the board
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
